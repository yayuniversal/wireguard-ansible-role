---
- name: Install WireGuard
  apt:
    name: wireguard
    state: present

- ansible.builtin.include_tasks: interface.yml
  args:
    apply:
      tags: wireguard-interface-{{ wg_interface.name }}
  vars:
    wg_interface: "{{ wireguard_interface_defaults | combine(wireguard_interface) }}"
  loop: "{{ wireguard_interfaces | dict2records('name') }}"
  loop_control:
    loop_var: wireguard_interface
    label: "{{ wireguard_interface.name }}"
